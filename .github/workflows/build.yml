name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Name APK with its version
        run: |
          VERSION="$(grep '^appVersion=' gradle.properties | cut -d= -f2).${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/water-meter-v$VERSION.apk"
          echo "### Water Meter v$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the **water-meter-v$VERSION** artifact below. The version also shows in the app under the title and in Settings." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: water-meter-v${{ env.VERSION }}
          path: out/water-meter-v${{ env.VERSION }}.apk
